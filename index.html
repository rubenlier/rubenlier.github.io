<div class="news-meta" id="worldnews-meta">Loading top clusters…</div>

        const MONTH_INDEX = {
            jan: 0, january: 0, feb: 1, february: 1, mar: 2, march: 2,
            apr: 3, april: 3, may: 4, jun: 5, june: 5, jul: 6, july: 6,
            aug: 7, august: 7, sep: 8, sept: 8, september: 8,
            oct: 9, october: 9, nov: 10, november: 10, dec: 11, december: 11
        };

        function dateFromParts(year, month, day) {
            const date = new Date(Date.UTC(Number(year), Number(month), Number(day)));
            return Number.isNaN(date.getTime()) ? null : date;
        }

        function extractOriginalPaperDate(text) {
            const dates = [];
            const monthWord = '(Jan(?:uary)?|Feb(?:ruary)?|Mar(?:ch)?|Apr(?:il)?|May|Jun(?:e)?|Jul(?:y)?|Aug(?:ust)?|Sep(?:t(?:ember)?)?|Oct(?:ober)?|Nov(?:ember)?|Dec(?:ember)?)';

            for (const match of text.matchAll(new RegExp(`\\b(\\d{1,2})\\s+${monthWord}\\s+(\\d{4})\\b`, 'gi'))) {
                const month = MONTH_INDEX[match[2].toLowerCase()];
                const date = dateFromParts(match[3], month, match[1]);
                if (date) dates.push(date);
            }

            for (const match of text.matchAll(new RegExp(`\\b${monthWord}\\s+(\\d{1,2})(?:st|nd|rd|th)?[,]?\\s+(\\d{4})\\b`, 'gi'))) {
                const month = MONTH_INDEX[match[1].toLowerCase()];
                const date = dateFromParts(match[3], month, match[2]);
                if (date) dates.push(date);
            }

            for (const match of text.matchAll(/\b(20\d{2})-(\d{2})-(\d{2})\b/g)) {
                const date = dateFromParts(match[1], Number(match[2]) - 1, match[3]);
                if (date) dates.push(date);
            }

            if (!dates.length) return null;
            return new Date(Math.min(...dates.map(date => date.getTime())));
        }

        function looksMostlyUppercase(text) {
            const letters = Array.from(text).filter(char => /\p{L}/u.test(char));
            if (!letters.length) return false;
            const uppercase = letters.filter(char => char === char.toLocaleUpperCase() && char !== char.toLocaleLowerCase());
            return uppercase.length / letters.length > 0.82;
        }

        function titleCaseAuthorList(text) {
            const particles = new Set(['and', 'da', 'de', 'del', 'der', 'di', 'du', 'la', 'le', 'van', 'von']);
            return text.toLocaleLowerCase().replace(/(^|[^\p{L}])([\p{L}][\p{L}'’.-]*)/gu, (match, prefix, word) => {
                const plain = word.replace(/[.'’-]/g, '');
                if (plain.length === 1) return prefix + word.toLocaleUpperCase();
                if (particles.has(word)) return prefix + word;
                return prefix + word.charAt(0).toLocaleUpperCase() + word.slice(1);
            });
        }

        function normalizeAuthorLine(paper) {
            const heading = paper.querySelector('h1, h2, h3, h4');
            const candidates = Array.from(paper.querySelectorAll('.authors, p, li'))
                .filter(element => element !== heading && /Ruben\s+Lier/i.test(element.textContent || ''))
                .sort((a, b) => (a.textContent || '').length - (b.textContent || '').length);
            const authorElement = candidates[0];
            if (!authorElement) return;

            let authorText = (authorElement.textContent || '').replace(/\s+/g, ' ').trim();
            if (looksMostlyUppercase(authorText)) authorText = titleCaseAuthorList(authorText);

            const escaped = escapeHtml(authorText);
            authorElement.innerHTML = escaped.replace(
                /\bRuben(?:\s+[A-Z]\.)?\s+Lier\b/gi,
                match => `<strong class="author-self">${match}</strong>`
            );
            authorElement.className = 'paper-authors';
        }

        function preparePaperCard(paper) {
            paper.className = 'paper paper-card';
            normalizeAuthorLine(paper);

            const date = extractOriginalPaperDate(paper.textContent || '');
            const dateElement = Array.from(paper.querySelectorAll('p, div, span'))
                .find(element => element.children.length === 0 && extractOriginalPaperDate(element.textContent || ''));
            if (dateElement) dateElement.classList.add('paper-date');

            return { paper, date };
        }

        function renderPaperSnippet(container, html) {
            const parsed = new DOMParser().parseFromString(html, 'text/html');
            const papers = Array.from(parsed.querySelectorAll('.paper'));

            if (!papers.length) {
                container.innerHTML = html;
                return;
            }

            const entries = papers.map(preparePaperCard).sort((a, b) => {
                if (a.date && b.date) return b.date - a.date;
                if (a.date) return -1;
                if (b.date) return 1;
                return 0;
            });

            const groups = new Map();
            for (const entry of entries) {
                const label = entry.date ? String(entry.date.getUTCFullYear()) : 'Other';
                if (!groups.has(label)) groups.set(label, []);
                groups.get(label).push(entry.paper);
            }

const REGION_COLORS = {
  "East Asia":        "#f1c40f", // yellow
  "China":            "#e67e22", // orange
  "South Asia":       "#8e5a2b", // brown

  "Middle East":      "#1e7f43", // dark green

  "North America":    "#e84393", // pink

};


// Fixed, complete legend order (used for legend + per-cluster bars)
const REGION_ORDER = [
  "East Asia",        // yellow
  "China",            // orange
  "South Asia",       // brown
  "Middle East",      // dark green
  "Africa",           // light green
  "Oceania",          // turquoise
  "Europe South",     // sea blue
  "Europe East",      // dark blue
  "Europe North",     // purple
  "North America",    // pink
  "South America"     // dark red
];
// Fallback color if you ever add a new label without updating REGION_COLORS
function colorForRegion(name){
  return REGION_COLORS[name] || "#111";
}

// Choose black/white text for contrast on a hex background
function getTextColorForBackground(hexColor){
  const hex = String(hexColor || "").replace("#", "");
  if (hex.length !== 6) return "#ffffff";
  const rgb = parseInt(hex, 16);
  const r = (rgb >> 16) & 0xff;
  const g = (rgb >> 8) & 0xff;
  const b = (rgb >> 0) & 0xff;
  const luminance = 0.299*r + 0.587*g + 0.114*b;
  return luminance > 150 ? "#000000" : "#ffffff";
}

function uniqueStable(arr){
  const out = [];
  const seen = new Set();
  for (const x of (arr || [])){
    if (!x) continue;
    if (seen.has(x)) continue;
    seen.add(x);
    out.push(x);
  }
  return out;
}

function sortRegionsLikeLegend(regions){
  const regs = uniqueStable(regions);

  const rank = new Map(REGION_ORDER.map((r, i) => [r, i]));
  const known = [];
  const unknown = [];

  for (const r of regs){
    if (rank.has(r)) known.push(r);
    else unknown.push(r); // preserve stable order for unexpected labels
  }

  known.sort((a, b) => rank.get(a) - rank.get(b));
  return known.concat(unknown);
}

function renderRegionLegend(regions){
  const wrap = document.getElementById("regionLegendWrap");
  const el = document.getElementById("regionLegend");
  if (!wrap || !el) return;

const regs = uniqueStable(regions);
  if (!regs.length){
    wrap.style.display = "none";
    el.innerHTML = "";
    return;
  }

  el.innerHTML = regs.map(r => `
    <span class="legend-item" title="${escapeHtml(r)}">
      <span class="legend-dot" style="background:${colorForRegion(r)};"></span>
      <span>${escapeHtml(r)}</span>
    </span>
  `).join("");

  wrap.style.display = "block";
}

// Build a rainbow bar from regions (sorted to match REGION_ORDER / legend)
function renderRegionBar(regions){
  const regs = sortRegionsLikeLegend(regions);
  if (!regs.length) return "";

  const n = regs.length;
  const segW = (100 / n);

  const segs = regs.map(r => `
    <div class="region-seg"
         style="width:${segW}%; background:${colorForRegion(r)};"
         title="${escapeHtml(r)}"></div>
  `).join("");

  return `
    <div class="region-bar" aria-label="Regions in this event">
      <div class="region-bar-inner">${segs}</div>
    </div>
  `;
}

        <script>

    function isoDayUTC(iso) {
    // "2026-01-03T20:56:50Z" -> "2026-01-03"
    return String(iso || "").slice(0, 10);
    }

    function pickLatestRun(runsForDay) {
    // created_at_utc is ISO UTC so lexicographic compare works
    return runsForDay
        .slice()
        .sort((a,b) => String(a.created_at_utc||"").localeCompare(String(b.created_at_utc||"")))
        .at(-1);
    }

    async function loadScoreHistoryGraph() {
    const metaEl = document.getElementById("scoreHistoryMeta");
    const svg = document.getElementById("scoreHistorySvg");
    const tooltip = document.getElementById("scoreTooltip");
    if (!metaEl || !svg || !tooltip) return;

    metaEl.textContent = "Loading…";

    const res = await fetch("output.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`Could not load output_content.json (HTTP ${res.status})`);

    const parsed = await res.json();
    const runs = Array.isArray(parsed) ? parsed : (parsed ? [parsed] : []);

    const valid = runs.filter(r => r && r.created_at_utc && Array.isArray(r.clusters) && r.clusters.length);
    if (!valid.length) {
        metaEl.textContent = "No runs with clusters yet.";
        svg.setAttribute("width", "760");
        svg.setAttribute("height", "120");
        svg.innerHTML = `<text x="10" y="30" class="scoreLabel">No data to plot.</text>`;
        return;
    }

    // Group by day, keep latest run per day
    const map = new Map();
    for (const r of valid) {
        const day = isoDayUTC(r.created_at_utc);
        if (!day) continue;
        if (!map.has(day)) map.set(day, []);
        map.get(day).push(r);
    }

    const days = Array.from(map.keys()).sort();
    const series = days.map(day => {
        const run = pickLatestRun(map.get(day));
        const topScore = Number(run?.clusters?.[0]?.score);
        if (!Number.isFinite(topScore)) return null;
        const top7titles = run.clusters.slice(0,7).map(c => c?.title ?? "(no title)");
        return { day, topScore, top7titles };
    }).filter(Boolean);

    if (!series.length) {
        metaEl.textContent = "No numeric scores found.";
        return;
    }

    metaEl.textContent = `Days: ${series.length}`;

    // ----- render SVG (wide + scroll) -----
    const NS = "http://www.w3.org/2000/svg";
    const margin = { top: 14, right: 18, bottom: 38, left: 56 };
    const daySpacing = 42;  // widen/narrow the graph per day
    const innerH = 220;
    const H = margin.top + innerH + margin.bottom;

    const W = Math.max(760, margin.left + margin.right + daySpacing * (series.length - 1));
    svg.setAttribute("width", String(W));
    svg.setAttribute("height", String(H));
    svg.innerHTML = "";

    const scores = series.map(p => p.topScore);
    const min = Math.min(...scores);
    const max = Math.max(...scores);
    const pad = (max - min) * 0.08 || 10;
    const yMin = min - pad;
    const yMax = max + pad;

    const xFor = (i) => margin.left + i * daySpacing;
    const yFor = (s) => {
        const t = (s - yMin) / (yMax - yMin);
        return margin.top + (1 - t) * innerH;
    };

    // background
    const bg = document.createElementNS(NS, "rect");
    bg.setAttribute("x","0"); bg.setAttribute("y","0");
    bg.setAttribute("width", String(W)); bg.setAttribute("height", String(H));
    bg.setAttribute("fill", "white");
    svg.appendChild(bg);

    // axes
    const xAxisY = margin.top + innerH;
    const axisLine = (x1,y1,x2,y2, color="#999") => {
        const l = document.createElementNS(NS, "line");
        l.setAttribute("x1", x1); l.setAttribute("y1", y1);
        l.setAttribute("x2", x2); l.setAttribute("y2", y2);
        l.setAttribute("stroke", color);
        l.setAttribute("stroke-width", "1");
        svg.appendChild(l);
    };
    axisLine(String(margin.left), String(margin.top), String(margin.left), String(xAxisY));
    axisLine(String(margin.left), String(xAxisY), String(W - margin.right), String(xAxisY));

    // y grid + ticks
    const ticks = 5;
    for (let i=0; i<=ticks; i++) {
        const t = i / ticks;
        const s = yMin + (1 - t) * (yMax - yMin);
        const y = yFor(s);

        axisLine(String(margin.left), String(y), String(W - margin.right), String(y), "#eee");

        const lab = document.createElementNS(NS, "text");
        lab.setAttribute("x", String(margin.left - 10));
        lab.setAttribute("y", String(y + 4));
        lab.setAttribute("text-anchor", "end");
        lab.setAttribute("class", "scoreTick");
        lab.textContent = (Math.round(s * 100) / 100).toString();
        svg.appendChild(lab);
    }



 // x labels: fewer + shorter (no rotation)
const formatDay = (day) => String(day || "").slice(5); // "2026-01-05" -> "01-05"
const labelEvery = Math.max(1, Math.ceil(series.length / 8)); // aim ~8 labels max

series.forEach((p, i) => {
  if (i % labelEvery !== 0 && i !== series.length - 1) return;

  const tx = document.createElementNS(NS, "text");
  tx.setAttribute("x", String(xFor(i)));
  tx.setAttribute("y", String(H - 12));
  tx.setAttribute("text-anchor", "middle");
  tx.setAttribute("class", "scoreTick");
  tx.textContent = formatDay(p.day);
  svg.appendChild(tx);
});



    // line path
    const path = document.createElementNS(NS, "path");
    const d = series.map((p,i) => `${i===0?"M":"L"} ${xFor(i)} ${yFor(p.topScore)}`).join(" ");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#111");
    path.setAttribute("stroke-width", "1.6");
    svg.appendChild(path);

// dots + tooltip
let activeDot = null; // track which dot is "locked open" on touch

const showTip = (ev, p) => {
  const items = p.top7titles.map(t => `<li>${escapeHtml(t)}</li>`).join("");
  tooltip.innerHTML = `
    <div class="date">${escapeHtml(p.day)} — top score: ${escapeHtml(p.topScore.toFixed(2))}</div>
    <div>Top 7 events:</div>
    <ol>${items}</ol>
  `;
  tooltip.style.display = "block";
  requestAnimationFrame(() => moveTip(ev));
};

const moveTip = (ev) => {
  const offset = 14;
  const rect = tooltip.getBoundingClientRect();

  let left = ev.clientX + offset;
  let top  = ev.clientY - rect.height - offset;

  if (top < 8) top = ev.clientY + offset;

  if (left + rect.width > window.innerWidth - 8) {
    left = ev.clientX - rect.width - offset;
  }
  if (left < 8) left = 8;

  if (top + rect.height > window.innerHeight - 8) {
    top = window.innerHeight - rect.height - 8;
  }

  tooltip.style.left = left + "px";
  tooltip.style.top  = top + "px";
};

const hideTip = () => {
  tooltip.style.display = "none";
  activeDot = null;
};

// IMPORTANT: close when tapping/clicking anywhere else
// (capture phase helps on mobile where SVG handling can be quirky)
document.addEventListener("pointerdown", (e) => {
  // If the tap is on a dot, the dot handler will run and stopPropagation().
  // Otherwise, close.
  hideTip();

// Also close on scroll/resize so it never gets "orphaned"
const scrollWrap = document.getElementById("scoreHistoryScroll");
if (scrollWrap) scrollWrap.addEventListener("scroll", hideTip, { passive: true });
window.addEventListener("resize", hideTip, { passive: true });

series.forEach((p,i) => {
  const c = document.createElementNS(NS, "circle");
  c.setAttribute("cx", String(xFor(i)));
  c.setAttribute("cy", String(yFor(p.topScore)));
  c.setAttribute("r", "4.2");
  c.setAttribute("fill", "#111");
  c.style.cursor = "pointer";

  // Desktop hover still works
  c.addEventListener("mouseenter", (ev) => showTip(ev, p));
  c.addEventListener("mousemove", (ev) => moveTip(ev));
  c.addEventListener("mouseleave", () => {
    // only hide on leave if we didn't "lock" it open via tap
    if (activeDot !== c) hideTip();
  });

  // Touch/mobile: tap toggles open/closed and "locks" it open
  c.addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    ev.stopPropagation(); // prevents the document handler from immediately closing it

    if (activeDot === c && tooltip.style.display === "block") {
      hideTip();          // tap same dot again -> close
      return;
    }

    activeDot = c;
    showTip(ev, p);
  });

  svg.appendChild(c);
});

    loadScoreHistoryGraph().catch(err => {
